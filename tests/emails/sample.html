<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>12306 购票成功通知 - 示例</title>
</head>
<body>
<!--
=============================================================================
12306 购票成功邮件示例

说明：
  这是一个模拟的 12306 购票成功邮件 HTML 文件，用于测试解析功能。
  实际的 12306 邮件格式可能有所不同，请使用真实邮件进行测试和调整。

注意：
  - 请勿在此文件中使用真实的个人信息
  - 身份证号等敏感信息应使用虚构数据
=============================================================================
-->

<div class="email-container" style="max-width: 600px; margin: 0 auto; font-family: 'Microsoft YaHei', sans-serif;">
    
    <!-- 邮件头部 -->
    <div class="header" style="background-color: #1565C0; color: white; padding: 20px; text-align: center;">
        <h1 style="margin: 0; font-size: 24px;">中国铁路 12306</h1>
        <p style="margin: 10px 0 0 0;">购票成功通知</p>
    </div>
    
    <!-- 订单信息 -->
    <div class="order-info" style="padding: 20px; background-color: #f5f5f5;">
        <p>尊敬的旅客，您好！</p>
        <p>您的火车票已购买成功，订单详情如下：</p>
        
        <table class="ticket-info" style="width: 100%; border-collapse: collapse; margin: 20px 0;">
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #ddd;">
                    <span class="label">订单号</span>
                </td>
                <td class="order-number" style="padding: 10px; border-bottom: 1px solid #ddd;">
                    E123456789
                </td>
            </tr>
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #ddd;">
                    <span class="label">车次</span>
                </td>
                <td class="train-number" style="padding: 10px; border-bottom: 1px solid #ddd; font-weight: bold; color: #1565C0;">
                    G1234
                </td>
            </tr>
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #ddd;">
                    <span class="label">乘车日期</span>
                </td>
                <td class="train-date" style="padding: 10px; border-bottom: 1px solid #ddd;">
                    2024年01月15日
                </td>
            </tr>
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #ddd;">
                    <span class="label">出发站</span>
                </td>
                <td class="departure-station" style="padding: 10px; border-bottom: 1px solid #ddd;">
                    北京南 <span class="time">08:30</span>
                </td>
            </tr>
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #ddd;">
                    <span class="label">到达站</span>
                </td>
                <td class="arrival-station" style="padding: 10px; border-bottom: 1px solid #ddd;">
                    上海虹桥 <span class="time">12:45</span>
                </td>
            </tr>
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #ddd;">
                    <span class="label">乘车人</span>
                </td>
                <td class="passenger-name" style="padding: 10px; border-bottom: 1px solid #ddd;">
                    张三
                </td>
            </tr>
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #ddd;">
                    <span class="label">证件号</span>
                </td>
                <td class="id-number" style="padding: 10px; border-bottom: 1px solid #ddd;">
                    1101**********1234
                </td>
            </tr>
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #ddd;">
                    <span class="label">席别/座位</span>
                </td>
                <td class="seat-info" style="padding: 10px; border-bottom: 1px solid #ddd;">
                    二等座 / 05车12A号
                </td>
            </tr>
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #ddd;">
                    <span class="label">票价</span>
                </td>
                <td class="ticket-price" style="padding: 10px; border-bottom: 1px solid #ddd; color: #E53935; font-weight: bold;">
                    ¥553.00
                </td>
            </tr>
        </table>
        
        <!-- 温馨提示 -->
        <div class="notice" style="background-color: #FFF3E0; padding: 15px; border-left: 4px solid #FF9800; margin-top: 20px;">
            <p style="margin: 0; font-weight: bold; color: #E65100;">温馨提示：</p>
            <ul style="margin: 10px 0 0 0; padding-left: 20px; color: #666;">
                <li>请携带有效身份证件提前到达车站</li>
                <li>建议您提前30分钟到达车站办理进站手续</li>
                <li>如需改签或退票，请在开车前办理</li>
            </ul>
        </div>
    </div>
    
    <!-- 邮件底部 -->
    <div class="footer" style="padding: 20px; text-align: center; color: #999; font-size: 12px;">
        <p>此邮件由系统自动发送，请勿回复</p>
        <p>中国铁路客户服务中心 www.12306.cn</p>
    </div>
    
</div>

</body>
</html>
